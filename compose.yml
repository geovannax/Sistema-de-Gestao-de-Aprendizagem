x-postgres-env:
  environment: &postgres-common-env
    POSTGRES_DB: ${POSTGRES_DB:-lms}
    POSTGRES_USER: ${POSTGRES_USER:-lms_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_CONTAINER_NAME: ${POSTGRES_CONTAINER_NAME:-lms_postgres}

x-web-env:
  environment: &web-common-env
    <<: *postgres-common-env
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    REDIS_CONTAINER_NAME: ${REDIS_CONTAINER_NAME:-lms_redis}
    # Variáveis de ambiente para o Django
    DJANGO_SETTINGS_MODULE: core.settings
    WEB_PORT: ${WEB_PORT:-8000}
    WEB_SECRET_KEY: ${WEB_SECRET_KEY}
    WEB_DEBUG: ${WEB_DEBUG:-false}
    WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-localhost,127.0.0.1}
    WEB_CSRF_TRUSTED_ORIGINS: ${WEB_CSRF_TRUSTED_ORIGINS:-https://localhost,https://127.0.0.1}

x-web-volumes:
  volumes: &web-common-volumes
    # Montagem dos diretórios
    - ./web/accounts:/app/accounts:rw
    - ./web/activity:/app/activity:rw
    - ./web/base_static:/app/base_static:rw
    - ./web/base_templates:/app/base_templates:rw
    - ./web/common:/app/common:rw
    - ./web/core:/app/core:rw
    - ./web/dataset:/app/dataset:rw
    - ./web/group:/app/group:rw
    - ./web/student:/app/student:rw
    # Montagem de arquivos individuais
    - ./web/.coverage:/app/.coverage:rw
    - ./web/.coveragerc:/app/.coveragerc:rw
    - ./web/conftest.py:/app/conftest.py:rw
    - ./web/manage.py:/app/manage.py:rw
    - ./web/mypy.ini:/app/mypy.ini:rw
    - ./web/pytest.ini:/app/pytest.ini:rw

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-lms_postgres}
    environment:
      <<: *postgres-common-env
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G
        reservations:
          cpus: "0.25"
          memory: 512M
    networks:
      lms-network:
        ipv4_address: ${POSTGRES_IPV4_ADDRESS:-172.20.0.2}

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-lms_redis}
    restart: ${REDIS_RESTART_POLICY:-no}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      lms-network:
        ipv4_address: ${REDIS_IPV4_ADDRESS:-172.20.0.5}

  web:
    build: 
      context: .
      dockerfile: web/Dockerfile
    
    image: ${WEB_IMAGE_NAME:-lms-web:latest}

    container_name: ${WEB_CONTAINER_NAME:-lms_web}
    restart: ${WEB_RESTART_POLICY:-no}

    environment:
      <<: *web-common-env

    command:
      - -c
      - |
        POSTGRES_COUNTER=0
        until nc -z -v -w30 $$POSTGRES_CONTAINER_NAME $$POSTGRES_PORT
        do
          echo "Aguardando a disponibilidade do POSTGRES..."
          sleep 5
          POSTGRES_COUNTER=$$((POSTGRES_COUNTER+1))
          if [ $$POSTGRES_COUNTER -eq 50 ]; then
            echo "Tempo limite atingido ao aguardar o POSTGRES"
            exit 1
          fi
        done

        python manage.py migrate
        python manage.py seed
        python manage.py collectstatic --noinput

        if [ "$$WEB_DEBUG" = "true" ]; then
          uvicorn core.asgi:application \
            --host 0.0.0.0 \
            --port $${WEB_PORT} \
            --reload
        else
          uvicorn core.asgi:application \
            --host 0.0.0.0 \
            --port $${WEB_PORT} \
            --workers 4 \
            --root-path /sistemadegestaodeaprendizagem
        fi

    volumes: *web-common-volumes

    ports:
      - "${WEB_PORT:-8000}:${WEB_PORT:-8000}"

    depends_on:
      - postgres
      - redis

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 768M

    networks:
      lms-network:
        ipv4_address: ${WEB_IPV4_ADDRESS:-172.20.0.3}

  celery:
    build: 
      context: .
      dockerfile: celery/Dockerfile

    image: ${CELERY_IMAGE_NAME:-lms-celery:latest}

    container_name: ${CELERY_CONTAINER_NAME:-lms_celery}
    restart: ${CELERY_RESTART_POLICY:-no}

    cap_add:
      - NET_ADMIN

    environment:
      <<: *web-common-env

    command:
      - -c
      - |
        until nc -z -w5 $$POSTGRES_CONTAINER_NAME $$POSTGRES_PORT; do
          echo "Aguardando PostgreSQL..."; sleep 3
        done

        # Bloqueia saída de rede do usuário nobody (isolamento do código dos alunos)
        iptables -A OUTPUT -m owner --uid-owner 65534 -j DROP || true

        celery -A core worker -l info --concurrency=8

    volumes: *web-common-volumes

    depends_on:
      - web

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 5G
        reservations:
          cpus: "0.5"
          memory: 1G

    networks:
      lms-network:
        ipv4_address: ${CELERY_IPV4_ADDRESS:-172.20.0.6}

  nginx:
    image: nginx

    profiles:
      - with_nginx

    container_name: ${NGINX_CONTAINER_NAME:-lms_nginx}
    restart: ${NGINX_RESTART_POLICY:-no}
    entrypoint: /bin/bash

    environment:
      TZ: America/Sao_Paulo
      DEBIAN_FRONTEND: noninteractive
      # Variáveis de ambiente web
      WEB_PUBLIC_DOMAIN_NAME: ${WEB_PUBLIC_DOMAIN_NAME:-dev-lms.com.br}
      WEB_CONTAINER_NAME: ${WEB_CONTAINER_NAME:-lms_web}
      # Files ssl
      WEB_PUBLIC_PRIVATE_KEY: ${WEB_PUBLIC_PRIVATE_KEY:-/etc/ssl/private/automatos_web_public_private_key.key}
      WEB_PUBLIC_CERT_CSR: ${WEB_PUBLIC_CERT_CSR:-/etc/ssl/certs/automatos_web_public_certificate.csr}
      WEB_PUBLIC_CERT_CRT: ${WEB_PUBLIC_CERT_CRT:-/etc/ssl/certs/automatos_web_public_certificate.crt}
      # Credenciais da documentação
      DOCS_USER: ${DOCS_USER:-docs}
      DOCS_PASSWORD: ${DOCS_PASSWORD:-docs}

    command:
      - -c
      - |
        printf '%s:%s\n' "$$DOCS_USER" "$(openssl passwd -apr1 "$$DOCS_PASSWORD")" > /etc/nginx/.htpasswd

        envsubst '$${WEB_PUBLIC_DOMAIN_NAME} $${WEB_CONTAINER_NAME} $${WEB_PUBLIC_PRIVATE_KEY} $${WEB_PUBLIC_CERT_CRT}' < /etc/nginx/conf.d/nginx.conf.template > /etc/nginx/conf.d/default.conf

        if [ ! -f $${WEB_PUBLIC_PRIVATE_KEY} ]; then
          openssl genrsa -out $${WEB_PUBLIC_PRIVATE_KEY} 2048
        fi

        if [ ! -f $${WEB_PUBLIC_CERT_CRT} ]; then
          openssl req -new -x509 -key $${WEB_PUBLIC_PRIVATE_KEY} -out $${WEB_PUBLIC_CERT_CRT} -days 365 -subj "/C=BR/ST=Minas Gerais/L=Barbacena/O=Geovanna/CN=$${WEB_PUBLIC_DOMAIN_NAME}"
        fi

        # Start nginx
        nginx -g "daemon off;"

    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/conf.d/nginx.conf.template:ro
      - ./web/static:/var/www/html/${WEB_CONTAINER_NAME:-lms_web}/static:ro
      - ./doc/site:/var/www/html/docs:ro
    
    depends_on:
      - web

    networks:
      lms-network:
        ipv4_address: ${NGINX_IPV4_ADDRESS:-172.20.0.4}

volumes:
  redis_data:
  postgres_data:

networks:
  lms-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.20.0.0/26}
          gateway: ${DOCKER_NETWORK_GATEWAY:-172.20.0.1}
