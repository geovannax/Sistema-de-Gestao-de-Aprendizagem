x-postgres-env:
  environment: &postgres-common-env
    POSTGRES_DB: ${POSTGRES_DB:-lms}
    POSTGRES_USER: ${POSTGRES_USER:-lms_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_CONTAINER_NAME: ${POSTGRES_CONTAINER_NAME}

x-web-env:
  environment: &web-common-env
    <<: *postgres-common-env
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    REDIS_CONTAINER_NAME: ${REDIS_CONTAINER_NAME}

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME}
    environment:
      <<: *postgres-common-env
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      lms-network:
        ipv4_address: ${POSTGRES_IPV4_ADDRESS:-172.20.0.2}

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME}
    restart: ${REDIS_RESTART_POLICY:-no}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      lms-network:
        ipv4_address: ${REDIS_IPV4_ADDRESS:-172.20.0.5}

  web:
    image: python:3.14
    container_name: ${WEB_CONTAINER_NAME}
    restart: ${WEB_RESTART_POLICY:-no}
    working_dir: /app
    entrypoint: /bin/bash
    environment:
      PYTHONUNBUFFERED: 1
      TZ: America/Sao_Paulo
      DJANGO_SETTINGS_MODULE: core.settings
      WEB_PORT: ${WEB_PORT:-8000}
      WEB_SECRET_KEY: ${WEB_SECRET_KEY}
      WEB_DEBUG: ${WEB_DEBUG:-false}
      WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-localhost,127.0.0.1}
      WEB_CSRF_TRUSTED_ORIGINS: ${WEB_CSRF_TRUSTED_ORIGINS:-https://localhost}

      # Variáveis de ambiente para o PostgreSQL e Redis
      <<: *web-common-env

    command:
      - -c
      - |
        apt update -y
        apt install -y netcat-openbsd

        python -m venv /venv
        source /venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt

        POSTGRES_COUNTER=0
        until nc -z -v -w30 $$POSTGRES_CONTAINER_NAME $$POSTGRES_PORT
        do
          echo "Aguardando a disponibilidade do POSTGRES..."
          sleep 5
          POSTGRES_COUNTER=$$((POSTGRES_COUNTER+1))
          if [ $$POSTGRES_COUNTER -eq 50 ]; then
            echo "Tempo limite atingido ao aguardar o POSTGRES"
            exit 1
          fi
        done

        python manage.py migrate
        python manage.py seed
        python manage.py collectstatic --noinput
        if [ "$$WEB_DEBUG" = "true" ]; then
          uvicorn core.asgi:application --host 0.0.0.0 --port $${WEB_PORT} --reload
        else
          uvicorn core.asgi:application --host 0.0.0.0 --port $${WEB_PORT} --workers 4
        fi

    volumes:
      - ./web:/app:rw
    ports:
      - "${WEB_PORT:-8000}:${WEB_PORT:-8000}"
    depends_on:
      - postgres
      - redis

    networks:
      lms-network:
        ipv4_address: ${WEB_IPV4_ADDRESS:-172.20.0.3}

  nginx:
    image: nginx
    container_name: ${NGINX_CONTAINER_NAME}
    restart: ${NGINX_RESTART_POLICY:-no}
    entrypoint: /bin/bash
    environment:
      TZ: America/Sao_Paulo
      DEBIAN_FRONTEND: noninteractive
      # Variáveis de ambiente web
      WEB_PUBLIC_DOMAIN_NAME: ${WEB_PUBLIC_DOMAIN_NAME:-dev-lms.com.br}
      WEB_CONTAINER_NAME: ${WEB_CONTAINER_NAME}
      # Files ssl
      WEB_PUBLIC_PRIVATE_KEY: ${WEB_PUBLIC_PRIVATE_KEY:-/etc/ssl/private/automatos_web_public_private_key.key}
      WEB_PUBLIC_CERT_CSR: ${WEB_PUBLIC_CERT_CSR:-/etc/ssl/certs/automatos_web_public_certificate.csr}
      WEB_PUBLIC_CERT_CRT: ${WEB_PUBLIC_CERT_CRT:-/etc/ssl/certs/automatos_web_public_certificate.crt}

    command:
      - -c
      - |
        envsubst '$${WEB_PUBLIC_DOMAIN_NAME} $${WEB_CONTAINER_NAME} $${WEB_PUBLIC_PRIVATE_KEY} $${WEB_PUBLIC_CERT_CRT}' < /etc/nginx/conf.d/nginx.conf.template > /etc/nginx/conf.d/default.conf

        if [ ! -f $${WEB_PUBLIC_PRIVATE_KEY} ]; then
          openssl genrsa -out $${WEB_PUBLIC_PRIVATE_KEY} 2048
        fi

        if [ ! -f $${WEB_PUBLIC_CERT_CRT} ]; then
          openssl req -new -x509 -key $${WEB_PUBLIC_PRIVATE_KEY} -out $${WEB_PUBLIC_CERT_CRT} -days 365 -subj "/C=BR/ST=Minas Gerais/L=Barbacena/O=Geovanna/CN=$${WEB_PUBLIC_DOMAIN_NAME}"
        fi

        # Start nginx
        nginx -g "daemon off;"

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/conf.d/nginx.conf.template:ro
      - ./web/static:/var/www/html/${WEB_CONTAINER_NAME}/static:ro
    depends_on:
      - web
    networks:
      lms-network:
        ipv4_address: ${NGINX_IPV4_ADDRESS:-172.20.0.4}

volumes:
  redis_data:
  postgres_data:

networks:
  lms-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.20.0.0/26}
          gateway: ${DOCKER_NETWORK_GATEWAY:-172.20.0.1}
