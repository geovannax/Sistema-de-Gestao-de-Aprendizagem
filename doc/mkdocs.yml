site_name: Sistema de Gestão de Aprendizagem
repo_url: https://github.com/geovannax/Sistema-de-Gestao-de-Aprendizagem
repo_name: geovannax/Sistema-de-Gestao-de-Aprendizagem
edit_uri: tree/main/doc/docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.top
    - navigation.sections
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: deep purple
      accent: deep purple

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
      title: Nesta página
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["../web"]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            members_order: source
            filters:
              - "!^_"
            show_if_no_docstring: false
            merge_init_into_class: true

