<form 
    hx-post="{{ request.path }}"
    hx-target="#main-content"
    hx-swap="innerHTML"
>
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label fw-semibold">{{ form.title.label }}</label>
        {{ form.title }}
        {% if form.title.errors %}
            <div class="text-danger small mt-1">{{ form.title.errors }}</div>
        {% endif %}
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">{{ form.description.label }}</label>
        {{ form.description }}
        {% if form.description.errors %}
            <div class="text-danger small mt-1">{{ form.description.errors }}</div>
        {% endif %}
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            {% if form.title.value %}Atualizar Lista{% else %}Criar Lista{% endif %}
        </button>
        <a href="{% url 'activity:list' %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
