
{% block content %}
<div class="container mt-4">
    <h1>Criar Atividade</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'activity:activity_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
