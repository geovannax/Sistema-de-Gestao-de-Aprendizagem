<!-- PAGE HEADER -->
<div id="form-header" hx-swap-oob="innerHTML">
    <div>
        <div class="form-card-title mb-0"> Código </div>
        <div class="form-card-subtitle"> Output do aluno é comparado com o esperado. </div>
    </div>
</div>

<form 
    hx-post="{{ request.path }}"
    hx-target="#main-content"
    hx-swap="innerHTML"> 
    {% csrf_token %}

    <!-- FORM PRINCIPAL -->
    {% include "global/partials/generic/create_or_update/_form.html" %}

    <!-- FORM SECUNDÁRIO -->
    {% with form=secondary_form %}
        {% include "global/partials/generic/create_or_update/_form.html" %}
    {% endwith %}
    <hr class="mt-3">

    <!-- Actions -->
    <div class="d-flex justify-content-end align-items-center gap-2">
        <div>
            <button
                hx-get="{% url 'activity:exercise_cancel' pk=activity_list %}"
                hx-target="#main-content"
                hx-swap="innerHTML"
                type="button"
                class="btn btn-outline-secondary rounded-5">
                <i class="bi bi-x-circle me-1"></i>
                Cancelar
            </button>
            <button type="submit" class="btn btn-outline-primary rounded-5" id="btnSubmit">
                <i class="bi bi-check-circle me-1"></i>
                {{ submit_title|default:"Salvar" }}
            </button>
        </div>
    </div>
</form>
