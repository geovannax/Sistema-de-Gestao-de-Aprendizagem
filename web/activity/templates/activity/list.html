<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Listas de Exercícios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listas de Exercícios</h2>
        <a href="{% url 'activity:create' %}" class="btn btn-primary">+ Nova Lista</a>
    </div>

    {% if object_list %}
        <table class="table table-bordered table-hover bg-white">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th>Criado em</th>
                </tr>
            </thead>
            <tbody>
                {% for lista in object_list %}
                <tr>
                    <td>{{ lista.pk }}</td>
                    <td>{{ lista.title }}</td>
                    <td>{{ lista.description|truncatechars:60 }}</td>
                    <td>{{ lista.created_at|date:"d/m/Y" }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="alert alert-info">Nenhuma lista criada ainda.</div>
    {% endif %}

</div>
</body>
</html>
