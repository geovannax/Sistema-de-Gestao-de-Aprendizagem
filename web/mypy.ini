[mypy]
plugins = mypy_django_plugin.main
ignore_missing_imports = True
no_strict_optional = True
exclude = (migrations|tests|conftest|manage\.py|\.venv)

[mypy.plugins.django-stubs]
django_settings_module = core.settings

[mypy-student.views]
# request.user is AbstractBaseUser|AnonymousUser but views are auth-protected;
# dynamically-set model attributes (is_answered, answer, etc.) are set at runtime.
disable_error_code = misc, attr-defined, union-attr
