{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Educatrix - Login</title>
        <link href="{% static 'global/icons/favicon.ico' %}" rel="icon" type="image/x-icon">   
        <!--Custom CSS-->
        <link rel="stylesheet" href="{% static 'global/css/colors.css' %}">
        <link href="{% static 'global/css/authentication.css' %}" rel="stylesheet">
        <!--Bootstrap-->
        <link href="{% static 'global/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
        <link href="{% static 'global/bootstrap/icons/bootstrap-icons.css' %}" rel="stylesheet">
    </head>
    <body>
        <div class="d-flex justify-content-center align-items-center min-vh-100">
            <div class="card p-5 shadow-sm" style="max-width: 400px; width: 100%;">            
                <!-- Logo -->
                <div class="text-center mb-5">
                    <div class="d-flex justify-content-center align-items-center mb-3">
                        <div class="me-3" style="width: 50px; height: 50px;">
                            <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center h-100">
                                <span class="text-white fw-bold fs-4">E</span>
                            </div>
                        </div>
                        <div>
                            <span class="fw-bold fs-3" style="color: #4f46e5;">
                                <span style="color: #059669;">EDUCA</span>TRIX
                            </span>
                        </div>
                    </div>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <!-- username -->
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label fw-500">
                            Usuário
                        </label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0">
                                <i class="bi bi-envelope text-muted"></i>
                            </span>
                            <input type="text" name="username" class="form-control py-3" placeholder="Seu nome de usuário" maxlength="320" id="id_username" required>
                        </div>
                    </div>

                    <!-- Senha -->
                    <div class="mb-4">
                        <label for="{{ form.password.id_for_label }}" class="form-label fw-500">
                            Senha
                        </label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input type="password" name="password" class="form-control py-3" placeholder="Digite sua senha" id="id_password" required>
                            <button 
                                class="btn btn-outline-secondary btn-show-text border-start-0" 
                                type="button" 
                                id="toggle-password"
                                tabindex="-1"
                            >
                                <i class="bi bi-eye" id="toggle-icon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Botão -->
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Entrar
                    </button>
                </form>
                
                <!-- Erros gerais -->
                {% if form.errors %}
                    <div class="alert text-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        Usuário ou senha inválidos
                    </div>
                {% endif %}

                <!-- Dados de Teste -->
                <div class="bg-light rounded p-3">
                    <small class="text-muted">
                        <strong>📧 Dados de teste:</strong><br>
                        Usuário: <code>prof</code><br>
                        Senha: <code>123Abc!</code>
                    </small>
                </div>
            </div>
        </div>
        <script src="{% static 'global/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static 'global/js/authentication.js' %}"></script>
    </body>
</html>
