{% if has_filtering_session %}
    <a href="{{ request.path }}?clear_filter=1" class="btn btn-sm btn-outline-primary rounded-5 d-flex align-items-center gap-2">
        <i class="bi bi-funnel"></i>
        <span class="d-none d-sm-inline">Filtrar</span>
    </a>
{% else %}
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-5 d-flex align-items-center gap-2" data-bs-toggle="collapse" data-bs-target="#formBox">
        <i class="bi bi-funnel"></i>
        <span class="d-none d-sm-inline">Filtrar</span>
    </button>
{% endif %}
