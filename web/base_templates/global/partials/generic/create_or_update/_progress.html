<div class="col-12 progress-section p-3 mb-3 rounded-3">
    <div class="progress-label">{{ progress_label|default:"Progresso do Formulário" }}</div>
    <div class="progress" role="progressbar"
         aria-label="{{ progress_label|default:"Progresso" }}"
         aria-valuenow="{{ progress_percent|default:0 }}"
         aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar {{ progress_bar_class|default:"" }}"
             id="progressBar"
             style="width: {{ progress_percent|default:0 }}%">
        </div>
    </div>
    <div class="progress-text">
        <span id="progressText">
            {% if progress_text %}{{ progress_text }}{% else %}{{ progress_percent|default:0 }}%{% endif %}
        </span>
    </div>
</div>
