{% for action in object.ui_actions %}

    {% if action.method == 'post' %}
        <form method="POST" action="{% url action.url pk=object.pk %}">
            {% csrf_token %}
            <button 
                type="submit"
                class="
                    btn btn-sm rounded-5 gap-3 px-3
                    {% if action.class %}
                        {{ action.class }}
                    {% else %}
                        btn-outline-primary
                    {% endif %}
                "
            >
                {% if action.icon %}
                    <i class="bi {{ action.icon }}"></i>
                {% endif %}

                {% if action.text %}
                    {{ action.text }}
                {% endif %}
            </button>
        </form>
    {% else %}
        <a
            href="{% url action.url object.pk %}"
            class="
                btn btn-sm rounded-5 gap-3 px-3
                {% if action.class %}
                    {{ action.class }}
                {% else %}
                    btn-outline-primary
                {% endif %}
            "
        >
            {% if action.icon %}
                <i class="bi {{ action.icon }}"></i>
            {% endif %}

            {% if action.text %}
                {{ action.text }}
            {% endif %}
        </a>
    {% endif %}
{% endfor %}
