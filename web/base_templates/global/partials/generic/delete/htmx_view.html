<div class="row d-flex justify-content-center align-items-center p-5">
    <div class="row w-100 justify-content-center mt-5">
        <div class="col-lg-5 col-md-6">
            <!-- Card Principal com Gradient -->
            <div class="card border-0 shadow-lg" style="overflow: hidden;">

                <!-- Body -->
                <div class="card-body p-5 text-center">

                    <div class="mb-3">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle" 
                                style="width: 70px; height: 70px; background: linear-gradient(135deg, #dc3545, #ff6b6b);">
                            <i class="bi bi-exclamation-lg text-white" style="font-size: 2.5rem;"></i>
                        </div>
                    </div>
                    <h2 class="fw-bold text-dark-custom mb-2">Ação Irreversível</h2>
                    <p class="text-muted mb-2">Você está prestes a deletar este item permanentemente.</p>

                    <!-- Aviso -->
                    <div>
                        <p class="text-muted text-center mb-1">
                            <small>📌 Ao confirmar, você perderá:</small>
                        </p>
                        <ul class="list-unstyled text-center text-muted small">
                            {% if checks %}
                                {% for check in checks %}
                                    <li><i class="bi bi-check2 text-danger me-2"></i>{{ check }}</li>
                                {% endfor %}
                            {% else %}
                                <li><i class="bi bi-check2 text-danger me-2"></i>Todos dados relacionados.</li>
                            {% endif %}
                        </ul>
                    </div>

                    <!-- Divider -->
                    <hr>

                    <!-- Buttons -->
                        
                    <div class="d-flex gap-2 justify-content-center">
                        <button 
                            hx-get="{% url 'activity:exercise_cancel' pk=activity_list %}"
                            hx-target="#main-content"
                            hx-swap="innerHTML"
                            type="button"
                            class="btn btn-outline-secondary rounded-5">
                            <i class="bi bi-x-circle me-2"></i>
                            Cancelar
                        </button>

                        <button
                            class="btn btn-sm btn-outline-danger rounded-5 px-3"
                            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                            hx-post="{% url 'activity:exercise_delete' pk=exercise.id %}"
                            hx-target="#main-content"
                            hx-swap="innerHTML">
                            <i class="bi bi-trash-fill me-2"></i>
                            Deletar
                        </button>

                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
