<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Acesso Proibido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            /* Cores básicas */
            --white: #ffffff;

            /* Tons de Azul */
            --blue-50: #f0f8ff;
            --blue-500: #0969da;
            --blue-700: #0749c8;

            /* Tons de cinza */
            --gray-600: #495057;
            --gray-800: #1f2937;

            /* Cores de estado */
            --danger: #dc3545;

            /* Background Gradient */
            --bg-light: #f5f7fa;
            --bg-medium: #e8eef7;
            --bg-light-2: #f0f4fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-medium) 50%, var(--bg-light-2) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
        }

        /* Background elements */
        .bg-element {
            display: none;
        }

        .container-error {
            text-align: center;
            z-index: 10;
            padding: 1rem;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--danger) 0%, #a82333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1;
            text-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            animation: pulse-large 2s ease-in-out infinite;
        }

        @keyframes pulse-large {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gray-800);
            margin: 0.8rem 0 0.3rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
        }

        .error-description {
            font-size: 0.95rem;
            color: var(--gray-600);
            margin-bottom: 1.5rem;
            line-height: 1.6;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        .error-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            background: rgba(220, 53, 69, 0.15);
            border-radius: 50%;
            font-size: 45px;
            margin: 0 auto 1rem;
            animation: bounce 2s ease-in-out infinite;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(220, 53, 69, 0.2);
            color: var(--danger);
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }


        /* Responsive */
        @media (max-width: 1024px) and (min-width: 769px) {
            .error-code {
                font-size: 100px;
            }

            .error-title {
                font-size: 1.6rem;
            }

            .error-description {
                font-size: 0.9rem;
            }

            .error-icon {
                width: 80px;
                height: 80px;
                font-size: 40px;
            }

        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 1.4rem;
            }

            .error-description {
                font-size: 0.85rem;
            }

            .error-icon {
                width: 70px;
                height: 70px;
                font-size: 35px;
                margin: 0 auto 0.8rem;
            }

        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 60px;
            }

            .error-title {
                font-size: 1.2rem;
            }

            .error-description {
                font-size: 0.75rem;
                margin-bottom: 1rem;
            }

            .container-error {
                padding: 0.8rem;
                max-width: 100%;
            }

            .error-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
                margin: 0 auto 0.6rem;
            }

        }

        /* Shimmer effect on error code */
        .error-code {
            animation: pulse-large 2s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <!-- Animated background elements -->
    <div class="bg-element element-1"></div>
    <div class="bg-element element-2"></div>
    <div class="bg-element element-3"></div>

    <!-- Error container -->
    <div class="container-error">
        <div class="error-icon">
            <i class="bi bi-lock-fill"></i>
        </div>

        <h1 class="error-code">403</h1>
        <h2 class="error-title">Acesso Proibido</h2>

        <p class="error-description">
            Desculpe, você não tem permissão para acessar este recurso.<br>
            Entre em contato com o administrador se isso for um erro.
        </p>

        <div class="d-flex gap-3">
            <a href="/home/" class="btn btn-primary rounded-5 px-3">
                <i class="bi bi-house me-1"></i> Voltar para Home
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-primary rounded-5 px-5">
                <i class="bi bi-arrow-left me-1"></i> Voltar
            </a>
        </div>
    </div>
</body>

</html>
