<header>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container-fluid align-items-center">
            <!-- Brand/Logo -->
            <div class="d-flex align-items-center gap-2 ps-4">
                <a class="navbar-brand text-primary fw-bolder fs-4 m-0" href="{% url 'home' %}">
                    <i class="bi bi-book"></i> <span class='text-dark'>Scire</span><span class='text-primary'>ON</span>
                </a>
                <span id="viewModeBadge" class="view-mode-inline" data-mode="aluno">
                    <span data-view-mode-text>Aluno</span>
                </span>
            </div>

            <!-- Toggle para mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Menu Principal -->
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-dark me-4" href="{% url 'home' %}">
                            <i class="bi bi-house-door me-1"></i>Home
                        </a>
                    </li>

                    <li class="nav-item" data-professor-nav>
                        <a class="nav-link text-dark me-4" href="{% url 'group:active' %}">
                            Turmas
                        </a>
                    </li>

                    <li class="nav-item" data-professor-nav>
                        <a class="nav-link text-dark me-4" href="{% url 'activity:list' %}">
                            Atividades
                        </a>
                    </li>

                    <li class="nav-item" data-professor-nav>
                        <a class="nav-link text-dark me-4" href="{% url 'dataset:list' %}">
                            Dataset
                        </a>
                    </li>

                </ul>

                <div class="dropdown">
                    <button
                        class="btn btn_header fw-bolder rounded-pill px-3 py-2 d-flex align-items-center border-0 dropdown-toggle"
                        type="button"
                        id="profileDropdown"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        <div class="rounded-circle bg-white d-flex align-items-center justify-content-center me-2">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <div class="me-2 d-none d-lg-inline">
                            {{ request.user.get_full_name|default:request.user.username }}
                        </div>
                    </button>

                    <div class="dropdown-menu dropdown-menu-end mt-2 p-2 btn_header-dropdown-menu" >
                        <button class="dropdown-item header-view-mode-toggle" type="button" id="viewModeToggle">
                            <div class="d-flex align-items-center justify-content-between gap-3 w-100">
                                <div>
                                    <div>
                                        <i class="bi bi-eye me-2"></i>
                                        <span id="viewModeLabel">Visualizar como Professor</span>
                                    </div>
                                    <small class="text-muted ms-4">Alternar modo de visualizacao</small>
                                </div>
                            </div>
                        </button>
                        <hr class="dropdown-divider">                            
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button class="dropdown-item" type="submit">
                                <div><i class="bi bi-box-arrow-right me-2"></i>Sair</div>                                    
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const button = document.getElementById('viewModeToggle');
            const label = document.getElementById('viewModeLabel');
            const badge = document.getElementById('viewModeBadge');

            if (!button || !label || !badge) return;

            const params = new URLSearchParams(window.location.search);
            const urlMode = params.get('tipo');

            const normalizeUrlMode = function (mode) {
                if (mode === 'student') return 'aluno';
                if (mode === 'teacher') return 'professor';
                return mode === 'aluno' || mode === 'professor' ? mode : null;
            };

            const requestedMode = normalizeUrlMode(urlMode);
            if (requestedMode) {
                window.setViewMode(requestedMode);
            }

            const updateViewModeLabel = function () {
                const currentMode = window.getViewMode();

                label.textContent = currentMode === 'aluno'
                    ? 'Visualizar como Professor'
                    : 'Visualizar como Aluno';

                badge.dataset.mode = currentMode;
                badge.querySelector('[data-view-mode-text]').textContent = currentMode === 'aluno'
                    ? 'Aluno'
                    : 'Professor';

                document.querySelectorAll('[data-professor-nav]').forEach((item) => {
                    item.classList.toggle('d-none', currentMode === 'aluno');
                });

                document.querySelectorAll('[data-student-nav]').forEach((item) => {
                    item.classList.toggle('d-none', currentMode !== 'aluno');
                });
            };

            updateViewModeLabel();

            button.addEventListener('click', function () {
                const currentMode = window.getViewMode();
                const nextMode = currentMode === 'aluno' ? 'professor' : 'aluno';

                window.setViewMode(nextMode);
                window.location.href = '{% url "home" %}';
            });
        });
    </script>
</header>
