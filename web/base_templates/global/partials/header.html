<header>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container-fluid align-items-center">
            <!-- Brand/Logo -->
            <a class="navbar-brand text-primary fw-bolder ps-4 fs-4"  href="{% url 'home' %}">
                <i class="bi bi-book"></i> Educatrix
            </a>

            <!-- Toggle para mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Menu Principal -->
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-dark me-4" href="{% url 'home' %}">
                            <i class="bi bi-house-door me-1"></i>Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-dark me-4" href="#" onclick="showAlert()">
                            Professores
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-dark me-4" href="#" onclick="showAlert()">
                            Alunos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-dark me-4" href="{% url 'group:active' %}">
                            Turmas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-dark me-4" href="{% url 'activity:list' %}">
                            Atividades
                        </a>
                    </li>
                </ul>

                <div class="dropdown">
                    <button
                        class="btn btn_header fw-bolder rounded-pill px-3 py-2 d-flex align-items-center border-0 dropdown-toggle"
                        type="button"
                        id="profileDropdown"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                    >
                        <div class="rounded-circle bg-white d-flex align-items-center justify-content-center me-2">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <div class="me-2 d-none d-lg-inline">
                            {{ request.user.get_full_name|default:request.user.username }}
                        </div>
                    </button>

                    <div class="dropdown-menu dropdown-menu-end mt-2 p-2 btn_header-dropdown-menu" >
                        <a class="dropdown-item" href="#" onclick="showAlert()">
                            <div><i class="bi bi-person me-2"></i>Perfil</div>
                            <small class="text-muted ms-4">Editar informações pessoais</small>
                        </a>
                        <a class="dropdown-item" href="#" onclick="showAlert()">
                            <div><i class="bi bi-list me-2"></i>Atividades</div>
                            <small class="text-muted ms-4">Ver todas as suas atividades</small>
                        </a>
                        <hr class="dropdown-divider">                            
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button class="dropdown-item" type="submit">
                                <div><i class="bi bi-box-arrow-right me-2"></i>Sair</div>                                    
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </nav>

</header>
